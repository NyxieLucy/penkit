[package]
name = "penkit"
version = "0.1.0"
edition = "2021"
description = "🗡️ penkit — a lazy hacker's swiss knife CLI"
authors = ["nyxie"]

[[bin]]
name = "penkit"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.28"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI args
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Colors/styling
colored = "2"

# Clipboard
arboard = "3"

# Error handling
anyhow = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
